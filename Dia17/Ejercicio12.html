        const productos = [
            { nombre: "Portátil", precio: 900, stock: 3 },
            { nombre: "Ratón", precio: 25, stock: 15 },
            { nombre: "Monitor", precio: 250, stock: 0 },
            { nombre: "Cámara", precio: 150, stock: 7 },
            { nombre: "Teclado", precio: 80, stock: 2 },
            { nombre: "Webcam", precio: 80, stock: 10 },
            { nombre: "Tablet", precio: 80, stock: 10 },
            { nombre: "Altavoz", precio: 80, stock: 10 }
        ];
        const disponibles = productos
    .filter((producto) => producto.stock > 0)
    .sort((a, b) => {

        if (a.precio === b.precio) {

            if (a.stock === b.stock) {
                return a.nombre.localeCompare(b.nombre);
            }

            return b.stock - a.stock;
        }

        return b.precio - a.precio;
    });
