    <script>



        const ventas = [
            { producto: "Laptop", categoria: "Tecnologia", cantidad: 2 },
            { producto: "Ratón", categoria: "Tecnologia", cantidad: 5 },
            { producto: "Teclado", categoria: "Tecnologia", cantidad: 3 },
            { producto: "Auriculares", categoria: "Audio", cantidad: 10 },
            { producto: "Micrófono", categoria: "Audio", cantidad: 4 },
            { producto: "Altavoz", categoria: "Audio", cantidad: 6 }
        ];

        
        const resultado = ventas.reduce((acumulador, venta) => {
            acumulador[venta.categoria] = (acumulador[venta.categoria] || 0) + venta.cantidad;
            return acumulador;
        }, {});
