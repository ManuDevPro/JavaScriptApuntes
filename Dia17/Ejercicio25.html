    <script>



        const productos = [
            { nombre: "Laptop", categoria: "Tecnologia", precio: 1200, stock: 5 },
            { nombre: "Ratón", categoria: "Tecnologia", precio: 25, stock: 8 },
            { nombre: "Teclado", categoria: "Tecnologia", precio: 80, stock: 0 },
            { nombre: "Monitor", categoria: "Tecnologia", precio: 300, stock: 2 },
            { nombre: "Auriculares", categoria: "Audio", precio: 60, stock: 10 },
            { nombre: "Micrófono", categoria: "Audio", precio: 150, stock: 4 }
        ];

        const total = productos
        .reduce((acumulador, producto) => {
            acumulador[producto.categoria] = (acumulador[producto.categoria]||0) + producto.precio * producto.stock;
            return acumulador;
        }, {});

        console.log(total);



    </script>
