    <script>


        const ventas = [
            { producto: "Camiseta", categoria: "Ropa", cantidad: 4 },
            { producto: "Pantalón", categoria: "Ropa", cantidad: 2 },
            { producto: "Zapatillas", categoria: "Calzado", cantidad: 3 },
            { producto: "Botas", categoria: "Calzado", cantidad: 5 },
            { producto: "Gorra", categoria: "Accesorios", cantidad: 7 }
        ];

        const resultado = ventas.reduce((acumulador, venta) => {
            acumulador[venta.categoria] = (acumulador[venta.categoria] || 0) + venta.cantidad;
            return acumulador;
        }, {});
        console.log(resultado);




    </script>
