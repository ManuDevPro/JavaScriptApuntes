    <!--
    Reto — filter() + map() + reduce()

Tenemos:

const productos = [
    { nombre: "Laptop", precio: 1200, stock: 5 },
    { nombre: "Ratón", precio: 25, stock: 8 },
    { nombre: "Teclado", precio: 80, stock: 3 },
    { nombre: "Monitor", precio: 300, stock: 2 },
    { nombre: "Auriculares", precio: 60, stock: 10 }
];
🎯 Objetivo

Queremos calcular el valor total del stock de los productos que tengan más de 3 unidades.

Recuerda:

valor del stock = precio × stock

Por tanto, estamos interesados solamente en:

Laptop → 1200 × 5
Ratón → 25 × 8
Auriculares → 60 × 10

Y finalmente queremos un único número:

...
Condiciones

Quiero que utilices:

filter()
map()
reduce()

preferiblemente mediante chaining.

No uses for.

🧠 Importante

No te voy a decir qué debe hacer cada método.

Quiero que tú recuperes lo aprendido:

¿Qué hace filter()?
¿Qué hace map()?
¿Qué hace reduce()?

Piensa en la secuencia:

seleccionar → transformar → acumular

Hazlo completamente desde cero y pásame tu código. Si te atascas, no te daré la solución de golpe. Te iré dando una pista cada vez.
    -->


    <script>

        const productos = [
            { nombre: "Laptop", precio: 1200, stock: 5 },
            { nombre: "Ratón", precio: 25, stock: 8 },
            { nombre: "Teclado", precio: 80, stock: 3 },
            { nombre: "Monitor", precio: 300, stock: 2 },
            { nombre: "Auriculares", precio: 60, stock: 10 }
        ];

        const seleccion = productos.filter((producto) => producto.stock > 3)
            .map((producto) => {
                return {
                    nombre: producto.nombre,
                    precio: producto.precio,
                    stock: producto.stock
                }
            })
            .reduce((acumulador, producto) => acumulador + (producto.precio * producto.stock),0 )

        console.log(seleccion);
    </script>
