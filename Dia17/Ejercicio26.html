<body>
    <!--
    
    Ejercicio final — Día 17
const ventas = [
    { producto: "Laptop", categoria: "Tecnologia", cantidad: 2, precio: 1200 },
    { producto: "Ratón", categoria: "Tecnologia", cantidad: 5, precio: 25 },
    { producto: "Teclado", categoria: "Tecnologia", cantidad: 3, precio: 80 },
    { producto: "Auriculares", categoria: "Audio", cantidad: 10, precio: 60 },
    { producto: "Micrófono", categoria: "Audio", cantidad: 4, precio: 150 },
    { producto: "Altavoz", categoria: "Audio", cantidad: 6, precio: 90 }
];
🎯 Tu misión

Usa únicamente reduce() para obtener el valor total vendido por categoría, pero solo contando las ventas cuya cantidad sea igual o mayor que 5.

El resultado esperado es:

{
    Tecnologia: 125,
    Audio: 1140
}
🔑 Pista mínima

Dentro del reduce() necesitarás comprobar primero:

if (condicion) {
    acumular
}

Y recuerda cómo acceder dinámicamente a la categoría:

acumulador[venta.categoria]

Nada más. 😏
    
    -->
    
    
    
    <script>


        const ventas = [
            { producto: "Laptop", categoria: "Tecnologia", cantidad: 2, precio: 1200 },
            { producto: "Ratón", categoria: "Tecnologia", cantidad: 5, precio: 25 },
            { producto: "Teclado", categoria: "Tecnologia", cantidad: 3, precio: 80 },
            { producto: "Auriculares", categoria: "Audio", cantidad: 10, precio: 60 },
            { producto: "Micrófono", categoria: "Audio", cantidad: 4, precio: 150 },
            { producto: "Altavoz", categoria: "Audio", cantidad: 6, precio: 90 }
        ];

        const resultado = ventas.reduce((acumulador, venta) => {
            if (venta.cantidad >= 5) {
                acumulador[venta.categoria] = (acumulador[venta.categoria] || 0) + (venta.cantidad * venta.precio);
            };
            return acumulador;
        }, {});
        console.log(resultado);


    </script>
</body>

</html>
