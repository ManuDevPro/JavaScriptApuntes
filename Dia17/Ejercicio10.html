🎯 Ejercicio

Quiero obtener solo los productos con stock, y después:

Ordenarlos por precio de menor a mayor.
Si dos productos tienen el mismo precio, ordenarlos por stock de mayor a menor.
Hazlo usando chaining.

No te doy la estructura todavía.

        */


        const productos = [
            { nombre: "Portátil", precio: 900, stock: 3 },
            { nombre: "Ratón", precio: 25, stock: 15 },
            { nombre: "Monitor", precio: 250, stock: 0 },
            { nombre: "Cámara", precio: 150, stock: 7 },
            { nombre: "Teclado", precio: 80, stock: 2 }
        ];


        const disponibles = productos
        .filter((producto) => producto.stock > 0)
        .sort((a, b ) => {
            if (a.precio === b.precio){
                return b.stock - a.stock
            }
            return a.precio - b.precio
        });
        console.log(disponibles);
