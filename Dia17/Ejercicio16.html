<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ej16</title>
  </head>

  <body>
    <script>
      /*
        Quiero que hagas prácticamente lo mismo, pero añadiendo una transformación.

Esta vez:

solo productos con stock → nuevo objeto → nombre + precio con IVA

Resultado esperado:

[
    { nombre: "Portátil", precio: 1089 },
    { nombre: "Ratón", precio: 30.25 },
    { nombre: "Cámara", precio: 181.5 },
    { nombre: "Teclado", precio: 96.8 }
]

Usa:

filter()
map()
chaining
el cálculo del 21% que ya acabas de practicar.

No te doy la estructura.

Quiero ver si ahora puedes construirlo completamente tú. 💪
        */

      const productos = [
        { nombre: "Portátil", precio: 900, stock: 3 },
        { nombre: "Ratón", precio: 25, stock: 15 },
        { nombre: "Monitor", precio: 250, stock: 0 },
        { nombre: "Cámara", precio: 150, stock: 7 },
        { nombre: "Teclado", precio: 80, stock: 2 },
      ];

      const seleccion = productos
        .filter((producto) => producto.stock > 0)
        .map((producto) => {
          return {
            nombre: producto.nombre,
            precio: producto.precio + (producto.precio * 21) / 100,
          };
        });

      console.log(seleccion);
    </script>
  </body>
</html>
